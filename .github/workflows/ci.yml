name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cartavault_test
          POSTGRES_USER: cartavault_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartavault_ci -d cartavault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cartavault_ci:ci-only-password@127.0.0.1:5432/cartavault_ci
      TEST_DATABASE_URL: postgresql+psycopg://cartavault_ci:ci-only-password@127.0.0.1:5432/cartavault_test
      CARTAVAULT_ENVIRONMENT: test
      CARTAVAULT_COOKIE_SECURE: "false"
      CARTAVAULT_SESSION_SECRET: ci-session-secret-not-used-outside-github-actions
      CARTAVAULT_SETUP_TOKEN: ci-setup-token-not-used-outside-github-actions
      CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      FRONTEND_PUBLIC_URL: http://127.0.0.1:5173
      EMAIL_PROVIDER: none
      EMAIL_FROM_ADDRESS: ci@example.invalid
      PHOTO_STORAGE_PATH: /tmp/cartavault/photos
      AVATAR_STORAGE_PATH: /tmp/cartavault/avatars
      EXPORT_STORAGE_PATH: /tmp/cartavault/exports

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Create the Alembic validation database
        env:
          PGPASSWORD: ci-only-password
        run: |
          createdb \
            --host 127.0.0.1 \
            --username cartavault_ci \
            cartavault_ci
          psql \
            --host 127.0.0.1 \
            --username cartavault_ci \
            --dbname cartavault_ci \
            --command "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall app migrations tests

      - name: Apply and verify Alembic migrations
        working-directory: backend
        run: |
          python -m alembic upgrade heads
          python -m alembic heads
          python -m alembic current
          python -m alembic check

      - name: Prepare the isolated pytest database
        working-directory: backend
        run: DATABASE_URL="${TEST_DATABASE_URL}" python -m alembic upgrade heads

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated category icons
        run: npm run verify:category-icons

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build the frontend
        run: npm run build

      - name: Check frontend bundle budget
        run: npm run check:bundle

  container:
    name: Unified container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      CARTAVAULT_VERSION: 0.0.0-ci
      CARTAVAULT_HTTP_PORT: 8088
      POSTGRES_DB: cartavault
      POSTGRES_USER: cartavault
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql+psycopg://cartavault:ci-only-password@postgis:5432/cartavault
      FRONTEND_PUBLIC_URL: http://127.0.0.1:8088
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8088
      CARTAVAULT_COOKIE_SECURE: "false"
      CARTAVAULT_SESSION_SECRET: ci-session-secret-not-used-outside-github-actions
      CARTAVAULT_SETUP_TOKEN: ci-setup-token-not-used-outside-github-actions
      CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      EMAIL_PROVIDER: none
      EMAIL_FROM_ADDRESS: ci@example.invalid

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the two-service Compose contract
        run: docker compose -f docker/compose.yml config --quiet

      - name: Build the unified CartaVault image
        run: docker compose -f docker/compose.yml build cartavault

      - name: Start empty PostGIS and CartaVault
        run: docker compose -f docker/compose.yml up -d

      - name: Wait for migrations and readiness
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8088/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker/compose.yml logs
          exit 1

      - name: Verify frontend, API and static routing
        run: |
          curl --fail --silent http://127.0.0.1:8088/ | grep -q '<!doctype html>'
          curl --fail --silent http://127.0.0.1:8088/maps/deep-link | grep -q '<!doctype html>'
          curl --fail --silent http://127.0.0.1:8088/api/ | grep -q 'CartaVault API is running'
          curl --fail --silent http://127.0.0.1:8088/api/openapi.json | grep -q '"openapi"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/api/not-found)" = "404"

      - name: Verify non-root runtime and clean image contents
        run: |
          test "$(docker compose -f docker/compose.yml exec -T cartavault id -u)" != "0"
          test -z "$(docker compose -f docker/compose.yml exec -T cartavault find /app -name '.env' -o -name '.env.*')"
          test -z "$(docker compose -f docker/compose.yml exec -T cartavault find /app/frontend -name '*.map')"
          docker compose -f docker/compose.yml exec -T cartavault test -f /app/frontend/index.html
          docker compose -f docker/compose.yml exec -T cartavault test -d /app/frontend/assets
          ! docker compose -f docker/compose.yml exec -T cartavault touch /app/runtime-write-test
          test "$(docker compose -f docker/compose.yml exec -T cartavault awk '/CapEff/ { print $2 }' /proc/1/status)" = "0000000000000000"
          test "$(docker compose -f docker/compose.yml exec -T cartavault awk '/NoNewPrivs/ { print $2 }' /proc/1/status)" = "1"

      - name: Verify restart at Alembic head and media persistence
        run: |
          docker compose -f docker/compose.yml exec -T cartavault sh -c 'printf persisted > /app/storage/photos/container-smoke.txt'
          docker compose -f docker/compose.yml up -d --force-recreate cartavault
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8088/healthz >/dev/null; then
              break
            fi
            sleep 5
          done
          docker compose -f docker/compose.yml exec -T cartavault grep -q persisted /app/storage/photos/container-smoke.txt
          docker compose -f docker/compose.yml exec -T cartavault python -m alembic current

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs

      - name: Stop the smoke stack
        if: always()
        run: docker compose -f docker/compose.yml down --volumes --remove-orphans

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan committed content
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --verbose
