name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cartavault_test
          POSTGRES_USER: cartavault_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartavault_ci -d cartavault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cartavault_ci:ci-only-password@127.0.0.1:5432/cartavault_ci
      TEST_DATABASE_URL: postgresql+psycopg://cartavault_ci:ci-only-password@127.0.0.1:5432/cartavault_test
      CARTAVAULT_ENVIRONMENT: test
      CARTAVAULT_COOKIE_SECURE: "false"
      CARTAVAULT_SESSION_SECRET: ci-session-secret-not-used-outside-github-actions
      CARTAVAULT_SETUP_TOKEN: ci-setup-token-not-used-outside-github-actions
      CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      FRONTEND_PUBLIC_URL: http://127.0.0.1:5173
      EMAIL_PROVIDER: none
      EMAIL_FROM_ADDRESS: ci@example.invalid
      PHOTO_STORAGE_PATH: /tmp/cartavault/photos
      AVATAR_STORAGE_PATH: /tmp/cartavault/avatars
      EXPORT_STORAGE_PATH: /tmp/cartavault/exports

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Create the Alembic validation database
        env:
          PGPASSWORD: ci-only-password
        run: |
          createdb \
            --host 127.0.0.1 \
            --username cartavault_ci \
            cartavault_ci
          psql \
            --host 127.0.0.1 \
            --username cartavault_ci \
            --dbname cartavault_ci \
            --command "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall app migrations tests

      - name: Apply and verify Alembic migrations
        working-directory: backend
        run: |
          python -m alembic upgrade heads
          python -m alembic heads
          python -m alembic current
          python -m alembic check

      - name: Prepare the isolated pytest database
        working-directory: backend
        run: DATABASE_URL="${TEST_DATABASE_URL}" python -m alembic upgrade heads

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated category icons
        run: npm run verify:category-icons

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build the frontend
        run: npm run build

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed content
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --verbose
