name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked dependency tree
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit the frontend lockfile
        shell: bash
        run: |
          set +e
          npm audit \
            --prefix frontend \
            --audit-level=high \
            --json > npm-audit.json
          audit_status=$?
          set -e
          node scripts/ci/classify-npm-audit.mjs \
            npm-audit.json \
            "$audit_status" \
            security/dependency-audit-exceptions.json

  backend:
    name: Python requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-audit.txt

      - name: Install the vulnerability auditor
        run: python -m pip install --requirement backend/requirements-audit.txt

      - name: Audit backend requirements
        shell: bash
        run: |
          set +e
          python -m pip_audit \
            --requirement backend/requirements.txt \
            --format json \
            --output pip-audit.json \
            --progress-spinner off \
            --strict
          audit_status=$?
          set -e
          python scripts/ci/classify_pip_audit.py \
            pip-audit.json \
            "$audit_status" \
            security/dependency-audit-exceptions.json
