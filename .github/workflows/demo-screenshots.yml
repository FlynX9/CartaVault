name: Demo screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "demo/**"
      - "frontend/**"
      - "backend/**"
      - "docker/Dockerfile"
      - ".github/workflows/demo-screenshots.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the isolated demo
        working-directory: demo
        run: docker compose up --build -d postgis-demo cartavault-demo
      - name: Validate the fixture
        working-directory: demo
        run: docker compose run --rm demo-reset validate
      - name: Capture the documented screens
        working-directory: demo
        run: docker compose --profile screenshots run --rm --build screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartavault-demo-screenshots
          path: demo/output
          if-no-files-found: error
      - name: Show service logs
        if: failure()
        working-directory: demo
        run: docker compose logs --no-color
      - name: Stop demo
        if: always()
        working-directory: demo
        run: docker compose down -v
