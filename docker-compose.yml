services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: CartaVault
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartavault}
      POSTGRES_USER: ${POSTGRES_USER:-poi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/010_extensions.sql:/docker-entrypoint-initdb.d/010_extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
