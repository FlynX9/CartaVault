<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CartaVault" />
    <meta
      name="description"
      content="Carte interactive des points d'intérêt de CartaVault"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/cartavault-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/cartavault-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CartaVault</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('cartavault.theme')
          const dark = preference === 'dark'
            || ((preference === null || preference === 'system')
              && matchMedia('(prefers-color-scheme: dark)').matches)
          const theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const density = localStorage.getItem('cartavault.display-density')
          document.documentElement.dataset.density = density === 'comfortable' || density === 'spacious'
            ? density
            : 'compact'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.documentElement.dataset.density = 'compact'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
