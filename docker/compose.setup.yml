name: cartavault-setup

services:
  setup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:-1.0.0-rc.4}
        VITE_API_BASE_URL: /api
    image: cartavault:${CARTAVAULT_VERSION:-1.0.0-rc.4}
    user: "0:0"
    entrypoint: ["python", "-m", "app.setup_cli"]
    environment:
      CARTAVAULT_ENV_FILE: /config/.env
    volumes:
      - ${CARTAVAULT_ENV_FILE:-./.env}:/config/.env
