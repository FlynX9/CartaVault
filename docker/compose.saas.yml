name: cartavault-saas

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:?CARTAVAULT_VERSION is required}
  CARTAVAULT_ENVIRONMENT: production
  CARTAVAULT_API_PREFIX: /api
  CARTAVAULT_FRONTEND_DIST: /app/frontend
  CARTAVAULT_PUBLIC_URL: https://${CARTAVAULT_HOSTNAME:?CARTAVAULT_HOSTNAME is required}
  FRONTEND_PUBLIC_URL: https://${CARTAVAULT_HOSTNAME:?CARTAVAULT_HOSTNAME is required}
  CORS_ALLOWED_ORIGINS: https://${CARTAVAULT_HOSTNAME:?CARTAVAULT_HOSTNAME is required}
  CARTAVAULT_COOKIE_SECURE: "true"
  CARTAVAULT_FORWARDED_ALLOW_IPS: ${CARTAVAULT_PROXY_CIDR:-172.16.0.0/12}
  CARTAVAULT_SESSION_SECRET: ${CARTAVAULT_SESSION_SECRET:?CARTAVAULT_SESSION_SECRET is required}
  CARTAVAULT_SETUP_TOKEN: ${CARTAVAULT_SETUP_TOKEN:?CARTAVAULT_SETUP_TOKEN is required}
  CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: ${CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY:?CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY is required}
  CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL: ${CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL:-}
  CARTAVAULT_BOOTSTRAP_ADMIN_NAME: ${CARTAVAULT_BOOTSTRAP_ADMIN_NAME:-}
  CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD: ${CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD:-}
  CARTAVAULT_UVICORN_WORKERS: ${CARTAVAULT_UVICORN_WORKERS:-3}
  CARTAVAULT_DB_POOL_SIZE: ${CARTAVAULT_DB_POOL_SIZE:-5}
  CARTAVAULT_DB_MAX_OVERFLOW: ${CARTAVAULT_DB_MAX_OVERFLOW:-5}
  CARTAVAULT_DB_POOL_TIMEOUT_SECONDS: ${CARTAVAULT_DB_POOL_TIMEOUT_SECONDS:-30}
  CARTAVAULT_DB_POOL_RECYCLE_SECONDS: ${CARTAVAULT_DB_POOL_RECYCLE_SECONDS:-1800}
  CARTAVAULT_TASK_MODE: sync
  MEDIA_STORAGE: ${MEDIA_STORAGE:-s3}
  MEDIA_CACHE_PATH: /tmp/cartavault-media-cache
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required for the SaaS stack}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required for the SaaS stack}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required for the SaaS stack}
  S3_PREFIX: ${S3_PREFIX:-media}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_USE_SSL: ${S3_USE_SSL:-true}
  S3_VERIFY_TLS: ${S3_VERIFY_TLS:-true}
  PHOTO_STORAGE_PATH: /app/storage/photos
  AVATAR_STORAGE_PATH: /app/storage/avatars
  EXPORT_STORAGE_PATH: /app/storage/exports
  IMPORT_STORAGE_PATH: /app/storage/imports
  CARTAVAULT_VECTOR_MAP_DIR: /data/maps
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CartaVault}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_SECURITY: ${EMAIL_SMTP_SECURITY:-starttls}
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

services:
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      CARTAVAULT_HOSTNAME: ${CARTAVAULT_HOSTNAME:?CARTAVAULT_HOSTNAME is required}
      CARTAVAULT_NGINX_MAX_BODY_SIZE: ${CARTAVAULT_NGINX_MAX_BODY_SIZE:-110m}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ${CARTAVAULT_TLS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CARTAVAULT_ACME_ROOT:-./acme}:/var/www/certbot:ro
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    depends_on:
      cartavault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header='Host: '$$CARTAVAULT_HOSTNAME https://127.0.0.1:8443/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [edge, private]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging: *json-logging

  cartavault:
    image: ${CARTAVAULT_IMAGE:-ghcr.io/flynx9/cartavault}:${CARTAVAULT_VERSION}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *app-environment
    expose: ["8000"]
    volumes:
      - photos_data:/app/storage/photos
      - avatars_data:/app/storage/avatars
      - exports_data:/app/storage/exports
      - imports_data:/app/storage/imports
      - vector_maps_data:/data/maps
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [private]
    mem_limit: 3g
    cpus: 3.00
    pids_limit: 512
    logging: *json-logging

  postgis:
    image: postgis/postgis:16-3.5@sha256:7d7925e334fceb6079c0a5d150e925f192cde2cf1dd78767ca843e2996d39829
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-80}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [private]
    mem_limit: 3g
    cpus: 2.00
    pids_limit: 256
    logging: *json-logging

volumes:
  postgres_data:
  photos_data:
  avatars_data:
  exports_data:
  imports_data:
  vector_maps_data:

networks:
  edge:
  private:
    internal: true
