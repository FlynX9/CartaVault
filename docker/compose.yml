name: cartavault

x-cartavault-environment: &cartavault-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:?CARTAVAULT_VERSION is required}
  CARTAVAULT_ENVIRONMENT: production
  CARTAVAULT_API_PREFIX: /api
  CARTAVAULT_FRONTEND_DIST: /app/frontend
  CARTAVAULT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CARTAVAULT_COOKIE_SECURE: ${CARTAVAULT_COOKIE_SECURE:-true}
  CARTAVAULT_FORWARDED_ALLOW_IPS: ${CARTAVAULT_FORWARDED_ALLOW_IPS:-}
  CARTAVAULT_SESSION_SECRET: ${CARTAVAULT_SESSION_SECRET:?CARTAVAULT_SESSION_SECRET is required}
  CARTAVAULT_SETUP_TOKEN: ${CARTAVAULT_SETUP_TOKEN:?CARTAVAULT_SETUP_TOKEN is required}
  CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: ${CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY:?CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY is required}
  CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL: ${CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL:-}
  CARTAVAULT_BOOTSTRAP_ADMIN_NAME: ${CARTAVAULT_BOOTSTRAP_ADMIN_NAME:-}
  CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD: ${CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD:-}
  CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS: ${CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS:-120}
  CARTAVAULT_DATABASE_STABLE_CHECKS: ${CARTAVAULT_DATABASE_STABLE_CHECKS:-3}
  CARTAVAULT_DATABASE_CONNECT_TIMEOUT_SECONDS: ${CARTAVAULT_DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS: ${CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
  PHOTO_STORAGE_PATH: /app/storage/photos
  AVATAR_STORAGE_PATH: /app/storage/avatars
  EXPORT_STORAGE_PATH: /app/storage/exports
  IMPORT_STORAGE_PATH: /app/storage/imports
  CARTAVAULT_TASK_MODE: ${CARTAVAULT_TASK_MODE:-redis}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  CARTAVAULT_TASK_QUEUE: cartavault
  CARTAVAULT_PDF_MAP_TILES_ENABLED: ${CARTAVAULT_PDF_MAP_TILES_ENABLED:-true}
  CARTAVAULT_PDF_MAP_TILE_URL: ${CARTAVAULT_PDF_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  CARTAVAULT_PDF_MAP_TILE_CACHE: /app/storage/exports/pdf-map-tiles
  OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
  CARTAVAULT_REVERSE_GEOCODING_URL: ${CARTAVAULT_REVERSE_GEOCODING_URL:-https://nominatim.openstreetmap.org}
  CARTAVAULT_REVERSE_GEOCODING_USER_AGENT: ${CARTAVAULT_REVERSE_GEOCODING_USER_AGENT:-CartaVault/1.0 (self-hosted POI manager)}
  CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS:-8}
  CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS:-1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CartaVault}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

services:
  setup:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:-1.0.0}
        VITE_API_BASE_URL: /api
        VITE_STADIA_MAPS_API_KEY: ${VITE_STADIA_MAPS_API_KEY:-}
    image: cartavault:${CARTAVAULT_VERSION:-1.0.0}
    user: "0:0"
    entrypoint: ["python", "-m", "app.setup_cli"]
    environment:
      CARTAVAULT_ENV_FILE: /config/.env
    volumes:
      - ${CARTAVAULT_ENV_FILE:-./.env}:/config/.env

  postgis:
    image: postgis/postgis:16-3.5@sha256:7d7925e334fceb6079c0a5d150e925f192cde2cf1dd78767ca843e2996d39829
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [cartavault_private]

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [cartavault_private]

  cartavault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION}
        VITE_API_BASE_URL: /api
        VITE_STADIA_MAPS_API_KEY: ${VITE_STADIA_MAPS_API_KEY:-}
    image: cartavault:${CARTAVAULT_VERSION}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *cartavault-environment
    ports:
      - "${CARTAVAULT_HTTP_PORT:-8088}:8000"
    volumes:
      - photos_data:/app/storage/photos
      - avatars_data:/app/storage/avatars
      - exports_data:/app/storage/exports
      - imports_data:/app/storage/imports
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [cartavault_private]

  worker:
    image: cartavault:${CARTAVAULT_VERSION}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "-m", "app.tasks.worker"]
    environment:
      <<: *cartavault-environment
    volumes:
      - photos_data:/app/storage/photos
      - avatars_data:/app/storage/avatars
      - exports_data:/app/storage/exports
      - imports_data:/app/storage/imports
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      cartavault:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; from rq import Worker; import os; c=Redis.from_url(os.environ['REDIS_URL']); assert any(w.get_state() in {'idle','busy'} for w in Worker.all(connection=c))"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 20s
    networks: [cartavault_private]

volumes:
  postgres_data:
  photos_data:
  avatars_data:
  exports_data:
  imports_data:
  redis_data:

networks:
  cartavault_private:
    driver: bridge
