name: cartavault

# Optional Redis/worker extension for the bind-mounted Portainer/Synology
# stack. Deploy compose.portainer.yml alone for the standard beta topology.
services:
  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${CARTAVAULT_DATA_ROOT:-/volume2/docker/cartavault}/redis:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [cartavault_private]

  cartavault:
    environment:
      CARTAVAULT_TASK_MODE: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CARTAVAULT_TASK_QUEUE: ${CARTAVAULT_TASK_QUEUE:-cartavault}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    extends:
      file: compose.portainer.yml
      service: cartavault
    image: ${CARTAVAULT_IMAGE:-ghcr.io/flynx9/cartavault}:${CARTAVAULT_VERSION}
    ports: !reset []
    entrypoint: ["python", "-m", "app.tasks.worker"]
    environment:
      CARTAVAULT_TASK_MODE: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CARTAVAULT_TASK_QUEUE: ${CARTAVAULT_TASK_QUEUE:-cartavault}
    depends_on:
      cartavault:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; from rq import Worker; import os; c=Redis.from_url(os.environ['REDIS_URL']); assert any(w.get_state() in {'idle','busy'} for w in Worker.all(connection=c))"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 20s
