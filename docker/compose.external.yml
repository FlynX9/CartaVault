name: cartavault

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:?CARTAVAULT_VERSION is required}
  CARTAVAULT_ENVIRONMENT: production
  CARTAVAULT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CARTAVAULT_COOKIE_SECURE: ${CARTAVAULT_COOKIE_SECURE:-true}
  CARTAVAULT_SESSION_SECRET: ${CARTAVAULT_SESSION_SECRET:?CARTAVAULT_SESSION_SECRET is required}
  CARTAVAULT_SETUP_TOKEN: ${CARTAVAULT_SETUP_TOKEN:?CARTAVAULT_SETUP_TOKEN is required}
  CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: ${CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY:?CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY is required}
  PHOTO_STORAGE_PATH: /app/storage/photos
  AVATAR_STORAGE_PATH: /app/storage/avatars
  EXPORT_STORAGE_PATH: /app/storage/exports
  OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
  CARTAVAULT_REVERSE_GEOCODING_URL: ${CARTAVAULT_REVERSE_GEOCODING_URL:-https://nominatim.openstreetmap.org}
  CARTAVAULT_REVERSE_GEOCODING_USER_AGENT: ${CARTAVAULT_REVERSE_GEOCODING_USER_AGENT:-CartaVault/1.0 (self-hosted POI manager)}
  CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS:-8}
  CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS:-1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CartaVault}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

services:
  setup:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:-1.0.0}
    image: cartavault-backend:${CARTAVAULT_VERSION:-1.0.0}
    user: "0:0"
    entrypoint: ["python", "-m", "app.setup_cli"]
    environment:
      CARTAVAULT_ENV_FILE: /config/.env
    volumes:
      - ${CARTAVAULT_ENV_FILE:-./.env}:/config/.env

  migrate:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION}
    image: cartavault-backend:${CARTAVAULT_VERSION}
    restart: "no"
    environment:
      <<: *backend-environment
      CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS: ${CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS:-120}
      CARTAVAULT_DATABASE_STABLE_CHECKS: ${CARTAVAULT_DATABASE_STABLE_CHECKS:-3}
      CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS: ${CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    command: ["python", "-m", "app.deployment", "migrate-and-bootstrap"]
    networks: [cartavault_private]

  backend:
    image: cartavault-backend:${CARTAVAULT_VERSION}
    restart: unless-stopped
    environment:
      <<: *backend-environment
    volumes:
      - photos_data:/app/storage/photos
      - avatars_data:/app/storage/avatars
      - exports_data:/app/storage/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [cartavault_private]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        CARTAVAULT_VERSION: ${CARTAVAULT_VERSION}
        VITE_API_BASE_URL: /api
        VITE_STADIA_MAPS_API_KEY: ${VITE_STADIA_MAPS_API_KEY:-}
    image: cartavault-frontend:${CARTAVAULT_VERSION}
    restart: unless-stopped
    ports:
      - "${CARTAVAULT_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [cartavault_private]

volumes:
  photos_data:
  avatars_data:
  exports_data:

networks:
  cartavault_private:
    driver: bridge
