name: cartavault

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  CARTAVAULT_VERSION: ${CARTAVAULT_VERSION:?CARTAVAULT_VERSION is required}
  CARTAVAULT_ENVIRONMENT: production
  CARTAVAULT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CARTAVAULT_COOKIE_SECURE: ${CARTAVAULT_COOKIE_SECURE:-true}
  CARTAVAULT_SESSION_SECRET: ${CARTAVAULT_SESSION_SECRET:?CARTAVAULT_SESSION_SECRET is required}
  CARTAVAULT_SETUP_TOKEN: ${CARTAVAULT_SETUP_TOKEN:?CARTAVAULT_SETUP_TOKEN is required}
  CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY: ${CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY:?CARTAVAULT_CREDENTIALS_ENCRYPTION_KEY is required}
  PHOTO_STORAGE_PATH: /app/storage/photos
  AVATAR_STORAGE_PATH: /app/storage/avatars
  EXPORT_STORAGE_PATH: /app/storage/exports
  CARTAVAULT_PDF_MAP_TILES_ENABLED: ${CARTAVAULT_PDF_MAP_TILES_ENABLED:-true}
  CARTAVAULT_PDF_MAP_TILE_URL: ${CARTAVAULT_PDF_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  CARTAVAULT_PDF_MAP_TILE_CACHE: /app/storage/exports/pdf-map-tiles
  OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
  CARTAVAULT_REVERSE_GEOCODING_URL: ${CARTAVAULT_REVERSE_GEOCODING_URL:-https://nominatim.openstreetmap.org}
  CARTAVAULT_REVERSE_GEOCODING_USER_AGENT: ${CARTAVAULT_REVERSE_GEOCODING_USER_AGENT:-CartaVault/1.0 (self-hosted POI manager)}
  CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_TIMEOUT_SECONDS:-8}
  CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS: ${CARTAVAULT_REVERSE_GEOCODING_MIN_INTERVAL_SECONDS:-1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CartaVault}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

services:
  postgres:
    image: ${CARTAVAULT_IMAGE_PREFIX:-cartavault}-postgres:${CARTAVAULT_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${CARTAVAULT_DATA_ROOT:-/volume2/docker/cartavault}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - cartavault_private

  migrate:
    image: ${CARTAVAULT_IMAGE_PREFIX:-cartavault}-backend:${CARTAVAULT_VERSION}
    platform: linux/amd64
    restart: "no"
    environment:
      <<: *backend-environment
      CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL: ${CARTAVAULT_BOOTSTRAP_ADMIN_EMAIL:-}
      CARTAVAULT_BOOTSTRAP_ADMIN_NAME: ${CARTAVAULT_BOOTSTRAP_ADMIN_NAME:-}
      CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD: ${CARTAVAULT_BOOTSTRAP_ADMIN_PASSWORD:-}
      CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS: ${CARTAVAULT_DATABASE_READY_TIMEOUT_SECONDS:-120}
      CARTAVAULT_DATABASE_STABLE_CHECKS: ${CARTAVAULT_DATABASE_STABLE_CHECKS:-3}
      CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS: ${CARTAVAULT_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.deployment", "migrate-and-bootstrap"]
    networks:
      - cartavault_private

  backend:
    image: ${CARTAVAULT_IMAGE_PREFIX:-cartavault}-backend:${CARTAVAULT_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: *backend-environment
    volumes:
      - ${CARTAVAULT_DATA_ROOT:-/volume2/docker/cartavault}/photos:/app/storage/photos
      - ${CARTAVAULT_DATA_ROOT:-/volume2/docker/cartavault}/avatars:/app/storage/avatars
      - ${CARTAVAULT_DATA_ROOT:-/volume2/docker/cartavault}/exports:/app/storage/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - cartavault_private

  frontend:
    image: ${CARTAVAULT_IMAGE_PREFIX:-cartavault}-frontend:${CARTAVAULT_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${CARTAVAULT_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cartavault_private

networks:
  cartavault_private:
    driver: bridge
